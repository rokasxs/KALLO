<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Kallo Klubams — demo</title>
<meta name="description" content="Išbandykite Kallo Klubams su pavyzdiniais duomenimis: nariai, lankomumas, mokėjimai ir priminimai tėvams." />
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
<meta name="theme-color" content="#1A0A00" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
  /* App shell: dark sidebar on desktop, bottom tab bar on phones. Same brand tokens as kallo.lt. */
  :root {
    --ink: #1A0A00; --ink-2: #2B1A10; --coral: #FF6B47; --coral-deep: #E8522F;
    --cream: #FFFCFA; --blush: #FFF5F0; --pale: #FFD5C8; --muted: #6B5B52; --line: rgba(26,10,0,.09);
    --paid: #1D9E75; --paid-bg: #E3F5EE; --wait: #B7791F; --wait-bg: #FDF1DC; --late: #D64545; --late-bg: #FCE6E4;
    --serif: 'DM Serif Display', Georgia, serif; --sans: 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: var(--sans); font-size: 15px; line-height: 1.5; color: var(--ink); background: var(--cream); -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; border-radius: 6px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  .demobar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px max(16px, env(safe-area-inset-right, 0px)) 9px max(16px, env(safe-area-inset-left, 0px)); background: var(--coral); color: #fff; font-size: 13.5px; font-weight: 600; }
  .demobar .acts { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
  .demobar button { background: rgba(255,255,255,.18); border: 0; color: #fff; padding: 6px 12px; border-radius: 999px; font-weight: 600; font-size: 13px; }
  .demobar a { background: #fff; color: var(--coral-deep); padding: 6px 14px; border-radius: 999px; text-decoration: none; font-weight: 700; font-size: 13px; white-space: nowrap; }
  @media (max-width: 560px) { .demobar .txt-long { display: none; } }
  @media (min-width: 561px) { .demobar .txt-short { display: none; } }

  .app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: calc(100% - 40px); }
  .side { background: var(--ink); color: var(--cream); padding: 22px 14px; display: flex; flex-direction: column; gap: 22px; position: sticky; top: 40px; height: calc(100vh - 40px); }
  .logo { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; padding: 0 8px; }
  .logo-icon { width: 32px; height: 32px; background: var(--cream); border-radius: 9px; display: grid; place-items: center; position: relative; }
  .logo-icon span { font-family: var(--serif); color: var(--ink); font-size: 20px; line-height: 1; }
  .logo-icon::after { content: ''; position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; background: var(--coral); border-radius: 50%; }
  .logo-text { font-family: var(--serif); font-size: 24px; letter-spacing: -0.03em; }
  .club { margin: 0 4px; padding: 12px; border-radius: 12px; background: rgba(255,252,250,.07); display: grid; gap: 2px; }
  .club b { font-size: 14px; } .club small { font-size: 12px; color: rgba(255,252,250,.6); }
  .nav { display: grid; gap: 2px; }
  .nav button { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: transparent; border: 0; color: rgba(255,252,250,.72); padding: 10px 12px; border-radius: 10px; font-weight: 500; }
  .nav button:hover { background: rgba(255,252,250,.06); color: var(--cream); }
  .nav button[aria-current="page"] { background: rgba(255,107,71,.16); color: #fff; }
  .nav svg { width: 19px; height: 19px; flex-shrink: 0; }
  .nav .badge { margin-left: auto; background: var(--coral); color: #fff; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; }
  .side .who { margin-top: auto; padding: 10px 12px; font-size: 13px; color: rgba(255,252,250,.6); display: flex; align-items: center; gap: 10px; }
  .side .who i { width: 30px; height: 30px; border-radius: 50%; background: var(--coral); color: #fff; font-style: normal; font-weight: 700; display: grid; place-items: center; font-size: 12px; }

  main { padding: 28px max(16px, 3vw) 120px; min-width: 0; }
  .page-h { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 14px; margin-bottom: 22px; }
  .page-h h1 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: clamp(28px, 3.4vw, 38px); letter-spacing: -0.02em; line-height: 1.1; }
  .page-h p { margin: 4px 0 0; color: var(--muted); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 10px; border: 0; font-weight: 600; font-size: 14px; white-space: nowrap; }
  .btn-coral { background: var(--coral); color: #fff; } .btn-coral:hover { background: var(--coral-deep); }
  .btn-ink { background: var(--ink); color: var(--cream); }
  .btn-ghost { background: #fff; box-shadow: inset 0 0 0 1px var(--line); } .btn-ghost:hover { box-shadow: inset 0 0 0 1px var(--ink); }
  .btn-sm { height: 32px; padding: 0 12px; font-size: 13px; border-radius: 8px; }

  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; min-width: 0; }
  .card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
  .card-h h2 { margin: 0; font-size: 16px; }
  .card-b { padding: 16px 18px; }
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 16px; }
  @media (max-width: 1080px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .kpi { padding: 18px; display: grid; gap: 4px; }
  .kpi span { font-size: 13px; color: var(--muted); }
  .kpi strong { font-size: clamp(22px, 2.4vw, 28px); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .kpi small { font-size: 12.5px; color: var(--muted); }
  .kpi.accent { background: var(--ink); color: var(--cream); border-color: var(--ink); }
  .kpi.accent span, .kpi.accent small { color: rgba(255,252,250,.65); }
  .meter { height: 7px; background: rgba(255,252,250,.14); border-radius: 7px; overflow: hidden; margin-top: 6px; }
  .meter i { display: block; height: 100%; background: var(--coral); border-radius: 7px; transition: width .6s ease; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; }
  @media (max-width: 1080px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }

  .flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 640px) { .flow { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .flow div { border-radius: 12px; padding: 12px; background: var(--blush); display: grid; gap: 2px; font-size: 13px; }
  .flow div b { font-size: 14px; }
  .flow .done { background: var(--paid-bg); } .flow .next { background: #fff; box-shadow: inset 0 0 0 2px var(--coral); }
  .feed { display: grid; gap: 0; }
  .feed div { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .feed div:last-child { border-bottom: 0; }
  .feed i { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 13px; font-weight: 700; }
  .feed time { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .groups { display: grid; gap: 10px; }
  .grp-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; }
  .grp-row small { color: var(--muted); font-size: 12.5px; }
  .grp-row .meter { grid-column: 1 / -1; background: var(--blush); margin: 0; }
  .grp-row .meter i { background: var(--paid); }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .toolbar input, .toolbar select { height: 40px; border-radius: 10px; border: 1px solid var(--line); background: #fff; padding: 0 12px; min-width: 0; }
  .toolbar input { flex: 1 1 220px; }
  .table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .table th { text-align: left; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 11px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .table td { padding: 11px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .table tr:last-child td { border-bottom: 0; }
  .table tbody tr { cursor: pointer; transition: background .15s ease; }
  .table tbody tr:hover { background: var(--blush); }
  .table .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .scroll { overflow-x: auto; }
  .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .av { width: 32px; height: 32px; border-radius: 50%; background: var(--blush); color: var(--coral-deep); display: grid; place-items: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
  .who b { font-weight: 600; display: block; white-space: nowrap; }
  .who small { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .chip { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; transition: background .3s ease, color .3s ease; }
  .chip.paid { color: var(--paid); background: var(--paid-bg); } .chip.wait { color: var(--wait); background: var(--wait-bg); } .chip.late { color: var(--late); background: var(--late-bg); } .chip.none { color: var(--muted); background: #F3EEEA; }
  @media (max-width: 720px) { .hide-sm { display: none; } }

  .seg { display: inline-flex; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
  .seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 8px; font-weight: 600; font-size: 13.5px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--cream); }

  .att-wrap { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 900px) { .att-wrap { grid-template-columns: minmax(0, 1fr); } }
  .att-list { display: grid; }
  .att-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--line); background: transparent; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; }
  .att-item:last-child { border-bottom: 0; }
  .tick { width: 30px; height: 30px; border-radius: 9px; border: 2px solid var(--line); display: grid; place-items: center; color: transparent; font-weight: 700; transition: all .15s ease; flex-shrink: 0; }
  .att-item[aria-pressed="true"] .tick { background: var(--paid); border-color: var(--paid); color: #fff; }
  .hist { display: grid; gap: 8px; }
  .hist-row { display: grid; grid-template-columns: 110px minmax(0, 1fr) 48px; gap: 10px; align-items: center; font-size: 13.5px; }
  .hist-row .meter { background: var(--blush); margin: 0; } .hist-row .meter i { background: var(--paid); }

  .msg-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
  @media (max-width: 960px) { .msg-wrap { grid-template-columns: minmax(0, 1fr); } }
  .field { display: grid; gap: 6px; margin-bottom: 14px; }
  .field label { font-weight: 600; font-size: 13.5px; }
  .field select, .field textarea, .field input { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: #fff; width: 100%; }
  .field textarea { min-height: 130px; resize: vertical; line-height: 1.5; }
  .tpls { display: flex; flex-wrap: wrap; gap: 6px; }
  .tpls button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
  .tpls button:hover { border-color: var(--coral); }
  .phone { background: var(--ink); border-radius: 32px; padding: 9px; }
  .phone .scr { background: #fff; border-radius: 25px; min-height: 360px; padding: 18px 12px; display: flex; flex-direction: column; gap: 10px; }
  .phone .from { text-align: center; font-size: 12px; color: var(--muted); }
  .bubble { background: #EDEAE7; border-radius: 16px 16px 16px 4px; padding: 10px 12px; font-size: 13.5px; white-space: pre-wrap; word-break: break-word; }
  .bubble a { color: var(--coral-deep); font-weight: 700; }
  .meta { font-size: 12px; color: var(--muted); }
  .log div { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .log div:last-child { border-bottom: 0; }

  .set { display: grid; gap: 16px; max-width: 760px; }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .switch:last-child { border-bottom: 0; }
  .switch small { display: block; color: var(--muted); font-size: 13px; }
  .tg { width: 46px; height: 26px; border-radius: 999px; background: #E5DFDA; border: 0; position: relative; flex-shrink: 0; transition: background .2s ease; }
  .tg::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .2s ease; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .tg[aria-checked="true"] { background: var(--paid); } .tg[aria-checked="true"]::after { transform: translateX(20px); }

  .drawer-bg { position: fixed; inset: 0; background: rgba(26,10,0,.35); z-index: 40; opacity: 0; transition: opacity .25s ease; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--cream); z-index: 41; box-shadow: -20px 0 50px -20px rgba(26,10,0,.35); transform: translateX(100%); transition: transform .3s cubic-bezier(.2,.9,.3,1); overflow-y: auto; padding: 22px 22px calc(22px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; align-content: start; }
  .drawer.open { transform: none; } .drawer-bg.open { opacity: 1; }
  .drawer h2 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 28px; line-height: 1.1; }
  .dl { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 8px 12px; font-size: 14px; }
  .dl dt { color: var(--muted); } .dl dd { margin: 0; font-weight: 600; word-break: break-word; }
  .months { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .months div { border-radius: 10px; padding: 10px; display: grid; gap: 2px; font-size: 12.5px; background: #fff; border: 1px solid var(--line); }
  .dots { display: flex; gap: 6px; flex-wrap: wrap; }
  .dots i { width: 22px; height: 22px; border-radius: 6px; background: var(--paid); } .dots i.no { background: #E5DFDA; }
  .x { position: absolute; top: 16px; right: 16px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: #fff; box-shadow: inset 0 0 0 1px var(--line); font-size: 18px; }

  .import { border: 2px dashed var(--pale); border-radius: 14px; padding: 16px; display: grid; gap: 10px; background: var(--blush); }
  .import-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; font-size: 13px; padding: 8px 10px; background: #fff; border-radius: 10px; transition: background .4s ease; }
  .import-row.ok { background: var(--paid-bg); }

  #toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 60; display: grid; gap: 8px; }
  @media (min-width: 861px) { #toasts { bottom: 22px; } }
  .toast { background: var(--ink); color: var(--cream); padding: 12px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; box-shadow: 0 16px 40px -16px rgba(26,10,0,.5); display: flex; gap: 10px; align-items: center; animation: tin .35s cubic-bezier(.2,.9,.3,1.2); max-width: min(380px, calc(100vw - 32px)); }
  .toast i { width: 22px; height: 22px; border-radius: 50%; background: var(--paid); display: grid; place-items: center; font-style: normal; font-size: 12px; flex-shrink: 0; }
  @keyframes tin { from { opacity: 0; transform: translateY(10px) scale(.97); } }

  .tabbar { display: none; }
  @media (max-width: 860px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .side { display: none; }
    .tabbar { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); position: fixed; left: 0; right: 0; bottom: 0; z-index: 35; background: #fff; border-top: 1px solid var(--line); padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); }
    .tabbar button { border: 0; background: transparent; display: grid; justify-items: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--muted); padding: 6px 2px; border-radius: 10px; }
    .tabbar button[aria-current="page"] { color: var(--coral-deep); }
    .tabbar svg { width: 22px; height: 22px; }
    main { padding-top: 20px; }
    .mob-club { display: flex !important; }
  }
  .mob-club { display: none; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
  .mob-club b { font-size: 14px; }
  .empty { padding: 30px 18px; text-align: center; color: var(--muted); }
</style>
</head>
<body>

<div class="demobar" role="note">
  <span><span class="txt-long">Demo režimas — duomenys pavyzdiniai, viską galite spausti ir keisti.</span><span class="txt-short">Demo · pavyzdiniai duomenys</span></span>
  <span class="acts"><button type="button" data-act="reset">Atkurti</button><a href="/#registracija">Išbandyti su savo klubu</a></span>
</div>

<div class="app">
  <aside class="side" aria-label="Meniu">
    <a class="logo" href="/"><span class="logo-icon"><span>K</span></span><span class="logo-text">allo</span></a>
    <div class="club"><b>Sporto klubas „Startas“</b><small>Vilnius · <span data-bind="memberCount"></span> nariai</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="who"><i>RJ</i><span>Rūta J. · vadovė</span></div>
  </aside>
  <main id="view" tabindex="-1"></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Meniu"></nav>

<div class="drawer-bg" id="drawerBg" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden></aside>
<div id="toasts" aria-live="polite"></div>

<script>
(function () {
  'use strict';
  // ---------- icons ----------
  var I = {

    members: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c.6-3.4 3-5.5 6-5.5s5.4 2.1 6 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.7.8 2.8 2.6 3 5.2"/></svg>',
    att: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="17" rx="3"/><path d="M8 2v4M16 2v4M8.5 13.5l2.5 2.5 4.5-5"/></svg>',

    return mobClub() +
      '<div class="page-h"><div><h1>Mokėjimai · ' + MONTHS[TODAY.m] + '</h1><p>Surinkta ' + eur(s.paid) + ' iš ' + eur(s.due) + '. Terminas — ' + S.settings.due + ' d.</p></div><button class="btn btn-coral" data-act="remindLate"' + (s.open ? '' : ' disabled') + '>Priminti nesumokėjusiems (' + s.open + ')</button></div>' +
      '<div class="grid2" style="margin-bottom:16px"><div>' + imp + '</div><div class="card"><div class="card-b" style="display:grid;gap:10px">' +
        '<div class="hist-row"><span>Apmokėta</span><div class="meter"><i style="width:' + Math.round(s.paid / s.due * 100) + '%"></i></div><b class="num">' + Math.round(s.paid / s.due * 100) + ' %</b></div>' +
        '<div class="meta">Mokėjimo būdas: ' + (S.settings.method === 'paysera' ? 'Paysera nuoroda' : 'bankinis pavedimas su unikalia paskirtimi') + ' · pinigai keliauja tiesiai į klubo sąskaitą</div>' +
      '</div></div></div>' +
      '<div class="toolbar"><div class="seg" role="group" aria-label="Filtras">' + [['all', 'Visi'], ['late', 'Vėluoja'], ['wait', 'Laukiama'], ['paid', 'Apmokėta']].map(function (f) { return '<button type="button" data-payf="' + f[0] + '" aria-pressed="' + (UI.payFilter === f[0]) + '">' + f[1] + '</button>'; }).join('') + '</div></div>' +
      '<div class="card scroll"><table class="table"><thead><tr><th>Narys</th><th class="num">Suma</th><th>Būsena</th><th class="num">Veiksmas</th></tr></thead><tbody>' + (rows || '<tr><td colspan="4" class="empty">Visi sumokėjo. Puiku!</td></tr>') + '</tbody></table></div>';
  };

  var TPL = {
    req: 'Laba diena! {mėnuo} mokestis už {vardas} ({grupė}): {suma}. Apmokėti: kallo.lt/p/4k2m',
    rem: 'Primename: {mėnuo} mokestis už {vardas} — {suma}. Jei jau sumokėjote, ačiū ir nekreipkite dėmesio. kallo.lt/p/4k2m',
    cancel: 'Laba diena! Šiandien {grupė} treniruotės nebus. Susitiksime kitą kartą įprastu laiku. Klubas „Startas“'
  };
  function fill(t, m) {
    m = m || S.members[1];
    return t.replace(/\{vardas\}/g, m.name.split(' ')[0]).replace(/\{grupė\}/g, groupOf(m.group).name).replace(/\{suma\}/g, eur(m.fee)).replace(/\{mėnuo\}/g, cap(MONTHS_GEN[TODAY.m]));
  }
  function recipients() {
    if (UI.msgTo === 'all') return S.members;
    if (UI.msgTo === 'late') return S.members.filter(function (m) { return statusOf(m) !== 'paid'; });
    return S.members.filter(function (m) { return m.group === UI.msgTo; });
  }
  V.msg = function () {
    if (!UI.msgText) UI.msgText = TPL.rem;
    var rec = recipients(), sample = rec[0] || S.members[0], text = fill(UI.msgText, sample), parts = Math.max(1, Math.ceil(text.length / 70));
    var log = S.messages.map(function (x) { return '<div><span><b>' + esc(x.text) + '</b><br><span class="meta">' + esc(x.to) + ' · ' + x.n + ' ' + plural(x.n, 'gavėjas', 'gavėjai', 'gavėjų') + '</span></span><span class="meta">' + esc(x.at) + '</span></div>'; }).join('');
    return mobClub() +
      '<div class="page-h"><div><h1>Žinutės tėvams</h1><p>SMS ar el. laiškas vienai grupei arba visiems.</p></div></div>' +
      '<div class="msg-wrap"><div class="card"><div class="card-b">' +
        '<div class="field"><label for="msgTo">Kam siųsti</label><select id="msgTo"><option value="late"' + (UI.msgTo === 'late' ? ' selected' : '') + '>Nesumokėjusiems</option><option value="all"' + (UI.msgTo === 'all' ? ' selected' : '') + '>Visiems tėvams</option>' + S.groups.map(function (g) { return '<option value="' + g.id + '"' + (UI.msgTo === g.id ? ' selected' : '') + '>' + esc(g.name) + '</option>'; }).join('') + '</select></div>' +
        '<div class="field"><label>Šablonai</label><div class="tpls"><button type="button" data-tpl="req">Mokėjimo prašymas</button><button type="button" data-tpl="rem">Priminimas</button><button type="button" data-tpl="cancel">Treniruotė atšaukta</button></div></div>' +
        '<div class="field"><label for="msgText">Tekstas <span class="meta">— {vardas}, {grupė}, {suma}, {mėnuo} pakeičiami automatiškai</span></label><textarea id="msgText">' + esc(UI.msgText) + '</textarea></div>' +
        '<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between"><span class="meta" id="msgMeta">' + rec.length + ' ' + plural(rec.length, 'gavėjas', 'gavėjai', 'gavėjų') + ' · ' + parts + ' SMS dalis</span><button class="btn btn-coral" data-act="send"' + (rec.length ? '' : ' disabled') + '>Siųsti ' + rec.length + ' ' + plural(rec.length, 'gavėjui', 'gavėjams', 'gavėjų') + '</button></div>' +
      '</div><div class="card-h" style="border-top:1px solid var(--line)"><h2>Išsiųsta</h2></div><div class="card-b log">' + log + '</div></div>' +
      '<div><div class="phone" aria-label="SMS peržiūra"><div class="scr"><div class="from">Klubas „Startas“</div><div class="bubble" id="bubble">' + esc(text).replace(/(kallo\.lt\/p\/\w+)/, '<a>$1</a>') + '</div><div class="meta" style="text-align:center">Peržiūra: ' + esc(sample.parent) + '</div></div></div></div></div>';
  };

  V.set = function () {
    var st = S.settings;
    var sw = function (k, t, d) { return '<div class="switch"><span><b>' + t + '</b><small>' + d + '</small></span><button type="button" class="tg" role="switch" aria-checked="' + !!st[k] + '" data-sw="' + k + '" aria-label="' + t + '"></button></div>'; };
    return mobClub() +
      '<div class="page-h"><div><h1>Nustatymai</h1><p>Kaip ir kada Kallo rašo tėvams.</p></div></div>' +
      '<div class="set">' +
        '<div class="card"><div class="card-h"><h2>Automatiniai priminimai</h2></div><div class="card-b">' +
          sw('r1', '1 d. — mokėjimo prašymas', 'Visiems aktyviems nariams su suma ir nuoroda') +
          sw('r7', '7 d. — pirmas priminimas', 'Tik tiems, kas dar nesumokėjo') +
          sw('r14', '14 d. — antras priminimas', 'Ir sąrašas jums el. paštu') +
        '</div></div>' +
        '<div class="card"><div class="card-h"><h2>Kanalai ir mokėjimai</h2></div><div class="card-b">' +
          sw('sms', 'SMS žinutės', 'Mokamos pagal savikainą') + sw('email', 'El. laiškai', 'Nemokami') +
          '<div class="field" style="margin-top:12px"><label for="method">Kaip tėvai moka</label><select id="method"><option value="paysera"' + (st.method === 'paysera' ? ' selected' : '') + '>Paysera apmokėjimo nuoroda</option><option value="bank"' + (st.method === 'bank' ? ' selected' : '') + '>Bankinis pavedimas su unikalia paskirtimi</option></select></div>' +
          '<div class="field"><label for="due">Mokėjimo terminas (mėnesio diena)</label><input id="due" type="number" min="1" max="28" value="' + st.due + '"></div>' +
        '</div></div>' +
        '<div class="card"><div class="card-h"><h2>Planas</h2></div><div class="card-b"><p style="margin:0 0 6px">„Klubas“ — 1 € už aktyvų narį per mėnesį.</p><p class="meta" style="margin:0">Šį mėnesį: ' + S.members.length + ' ' + plural(S.members.length, 'aktyvus narys', 'aktyvūs nariai', 'aktyvių narių') + ' = ' + eur(Math.max(39, S.members.length)) + '</p></div></div>' +
      '</div>';
  };

  // ---------- drawer ----------
  var lastFocus = null;
  function openMember(id) {
    var m = memberOf(id); if (!m) return; var g = groupOf(m.group);
    var att = S.attendance.filter(function (a) { return a.group === m.group; }).sort(function (a, b) { return a.date > b.date ? 1 : -1; });
    var months = HIST.map(function (mo) { var st = (S.payments[m.id] || {})[mo] || 'none', k = +mo.slice(5) - 1; return '<div><span class="meta">' + cap(MONTHS[k]) + '</span><span class="chip ' + st + '">' + STATUS[st] + '</span></div>'; }).join('');
    var st = statusOf(m);
    var d = $('#drawer');
    d.innerHTML = '<button class="x" type="button" data-act="close" aria-label="Uždaryti">×</button>' +
      '<div class="who"><span class="av" style="width:48px;height:48px;font-size:16px">' + initials(m.name) + '</span><span><h2 id="drawerTitle">' + esc(m.name) + '</h2><small>' + esc(g.name) + ' · narys nuo ' + m.since.replace('-', ' m. ') + ' mėn.</small></span></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' + (st !== 'paid' ? '<button class="btn btn-coral btn-sm" data-remind="' + m.id + '">Siųsti priminimą</button><button class="btn btn-ghost btn-sm" data-markpaid="' + m.id + '">Pažymėti apmokėtu</button>' : '<span class="chip paid">' + cap(MONTHS[TODAY.m]) + ' apmokėta</span>') + '</div>' +
      '<div class="card"><div class="card-b"><dl class="dl"><dt>Tėvai</dt><dd>' + esc(m.parent) + '</dd><dt>Telefonas</dt><dd>' + esc(m.phone) + '</dd><dt>El. paštas</dt><dd>' + esc(m.email) + '</dd><dt>Mokestis</dt><dd>' + eur(m.fee) + ' / mėn.' + (m.discount ? '<br><span class="meta">' + esc(m.discount) + '</span>' : '') + '</dd><dt>Treneris</dt><dd>' + esc(g.coach) + '</dd></dl></div></div>' +
      '<div><b>Mokėjimai</b><div class="months" style="margin-top:8px">' + months + '</div></div>' +
      '<div><b>Lankomumas · ' + MONTHS[TODAY.m] + '</b><div class="dots" style="margin-top:8px">' + att.map(function (a) { return '<i class="' + (a.present.indexOf(m.id) >= 0 ? '' : 'no') + '" title="' + a.date + '"></i>'; }).join('') + '</div><p class="meta">' + att.filter(function (a) { return a.present.indexOf(m.id) >= 0; }).length + ' iš ' + att.length + ' treniruočių</p></div>';
    lastFocus = document.activeElement;
    d.hidden = false; $('#drawerBg').hidden = false;
    requestAnimationFrame(function () { d.classList.add('open'); $('#drawerBg').classList.add('open'); d.querySelector('.x').focus(); });
  }
  function closeDrawer() {
    var d = $('#drawer'); d.classList.remove('open'); $('#drawerBg').classList.remove('open');
    setTimeout(function () { d.hidden = true; $('#drawerBg').hidden = true; }, 300);
    if (lastFocus) lastFocus.focus();
  }

  // ---------- render ----------
  function render(focusMain) {
    renderNav();
    var main = $('#view'); main.innerHTML = V[S.view]();
    if (focusMain) { main.focus({ preventScroll: true }); window.scrollTo(0, 0); }
    save();
  }
  function markPaid(id, silent) {
    var m = memberOf(id); if (!m) return;
    S.payments[id][CUR] = 'paid'; logActivity('paid', m.name + ' sumokėjo ' + eur(m.fee));
    if (!silent) toast(m.name + ' pažymėta(s) kaip sumokėjęs(-usi)');
  }

  // ---------- events ----------
  document.addEventListener('click', function (e) {
    var t = e.target.closest('button, tr[data-member], a');
    if (!t) { if (e.target.id === 'drawerBg') closeDrawer(); return; }
    var ds = t.dataset;
    if (ds.view) { S.view = ds.view; render(true); return; }
    if (ds.member) { openMember(ds.member); return; }
    if (ds.markpaid) { markPaid(ds.markpaid); render(); if (!$('#drawer').hidden) openMember(ds.markpaid); return; }
    if (ds.remind) { var m = memberOf(ds.remind); toast('Priminimas išsiųstas: ' + m.parent); logActivity('rem', 'Priminimas išsiųstas: ' + m.parent); render(); return; }
    if (ds.attgroup) { UI.attGroup = ds.attgroup; UI.attSel = null; render(); return; }
    if (ds.toggle) {
      var ids = UI.attSel.ids, i = ids.indexOf(ds.toggle);
      if (i >= 0) ids.splice(i, 1); else ids.push(ds.toggle);
      t.setAttribute('aria-pressed', i < 0);
      $('#attCount').textContent = ids.length + '/' + S.members.filter(function (x) { return x.group === UI.attGroup; }).length;
      return;
    }
    if (ds.payf) { UI.payFilter = ds.payf; render(); return; }
    if (ds.tpl) { UI.msgText = TPL[ds.tpl]; render(); return; }
    if (ds.sw) { S.settings[ds.sw] = !S.settings[ds.sw]; t.setAttribute('aria-checked', S.settings[ds.sw]); save(); toast('Nustatymas išsaugotas'); return; }
    switch (ds.act) {
      case 'close': closeDrawer(); break;
      case 'reset': try { localStorage.removeItem(KEY); } catch (er) {} S = seedData(); UI.imported = false; UI.attSel = null; render(true); toast('Demo atkurtas'); break;
      case 'remindLate':
        var open = S.members.filter(function (x) { return statusOf(x) !== 'paid'; });
        S.messages.unshift({ at: 'ką tik', to: 'Nesumokėjusiems', text: 'Priminimas: ' + MONTHS_GEN[TODAY.m] + ' mokestis', n: open.length });
        logActivity('rem', 'Išsiųsta ' + open.length + ' ' + plural(open.length, 'priminimas', 'priminimai', 'priminimų'));
        toast('Išsiųsta ' + open.length + ' ' + plural(open.length, 'priminimas', 'priminimai', 'priminimų') + ' tėvams'); render(); break;
      case 'saveAtt':
        var g = UI.attGroup, n = UI.attSel.ids.length, tot = S.members.filter(function (x) { return x.group === g; }).length;
        S.attendance.push({ id: g + '-14', group: g, date: '2026-11-14', present: UI.attSel.ids.slice() });
        S.attendance = S.attendance.filter(function (a, k, arr) { return arr.map(function (x) { return x.id; }).lastIndexOf(a.id) === k; });
        logActivity('att', 'Pažymėtas lankomumas: ' + groupOf(g).name + ' (' + n + '/' + tot + ')');
        toast('Lankomumas išsaugotas: ' + n + '/' + tot); render(); break;
      case 'import':
        var pick = S.members.filter(function (x) { return statusOf(x) !== 'paid'; }).slice(0, 3);
        UI.imported = pick.map(function (x, k) { return { line: '2026-11-1' + (2 + k) + ' · ' + eur(x.fee) + ' · „KS-' + x.id.toUpperCase() + ' ' + x.name.split(' ')[0] + '“', who: x.name }; });
        pick.forEach(function (x) { markPaid(x.id, true); });
        toast('Sutikrinta: ' + pick.length + ' ' + plural(pick.length, 'mokėjimas', 'mokėjimai', 'mokėjimų') + ' pažymėti automatiškai'); render(); break;
      case 'send':
        var rec = recipients();
        S.messages.unshift({ at: 'ką tik', to: UI.msgTo === 'all' ? 'Visiems' : UI.msgTo === 'late' ? 'Nesumokėjusiems' : groupOf(UI.msgTo).name, text: fill(UI.msgText).slice(0, 48) + (fill(UI.msgText).length > 48 ? '…' : ''), n: rec.length });
        toast('Žinutė išsiųsta ' + rec.length + ' ' + plural(rec.length, 'gavėjui', 'gavėjams', 'gavėjų')); render(); break;
      case 'addMember':
        var gid = UI.group !== 'all' ? UI.group : 'g3', gg = groupOf(gid), nid = 'm' + (S.members.length + 100);
        S.members.unshift({ id: nid, name: 'Naujas Narys', group: gid, parent: 'Tėvų vardas', phone: '+370 6•• ••000', email: 'tevai@pavyzdys.lt', fee: gg.fee, discount: '', since: '2026-11' });
        S.payments[nid] = { '2026-11': 'wait' }; toast('Narys pridėtas į ' + gg.name); render(); openMember(nid); break;
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !$('#drawer').hidden) closeDrawer();
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('tr[data-member]')) { e.preventDefault(); openMember(e.target.dataset.member); }
  });
  document.addEventListener('input', function (e) {
    var id = e.target.id;
    if (id === 'q') { UI.q = e.target.value; var pos = e.target.selectionStart; render(); var q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); }
    if (id === 'msgText') {
      UI.msgText = e.target.value; var rec = recipients(), text = fill(UI.msgText, rec[0] || S.members[0]);
      $('#bubble').innerHTML = esc(text).replace(/(kallo\.lt\/p\/\w+)/, '<a>$1</a>');
      $('#msgMeta').textContent = rec.length + ' ' + plural(rec.length, 'gavėjas', 'gavėjai', 'gavėjų') + ' · ' + Math.max(1, Math.ceil(text.length / 70)) + ' SMS dalis';
    }
    if (id === 'due') { var v = Math.min(28, Math.max(1, +e.target.value || 10)); S.settings.due = v; save(); }
  });
  document.addEventListener('change', function (e) {
    var id = e.target.id;
    if (id === 'fGroup') { UI.group = e.target.value; render(); }
    if (id === 'fStatus') { UI.status = e.target.value; render(); }
    if (id === 'msgTo') { UI.msgTo = e.target.value; render(); }
    if (id === 'method') { S.settings.method = e.target.value; save(); toast('Mokėjimo būdas pakeistas'); }
  });

  var start = (location.hash || '').slice(1);
  if (VIEWS.some(function (v) { return v.id === start; })) S.view = start;
  render();
})();
</script>
</body>
</html>
